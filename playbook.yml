---
# WildFly Cluster Demo – installs WildFly 40 in HA mode across the target hosts.
#
# Usage:
#   ansible-playbook -i inventory playbook.yml
#   ansible-playbook -i inventory playbook.yml -e wildfly_version=40.0.0.Final
#
# See vars/vars.yml for tuneable variables and README.md for full documentation.

- name: "Deploy WildFly {{ wildfly_version | default('40.0.0.Final') }} cluster (standalone-ha)"
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: true
  vars_files:
    - vars/vars.yml
  collections:
    - middleware_automation.wildfly

  pre_tasks:
    - name: "Show deployment summary"
      ansible.builtin.debug:
        msg:
          - "WildFly version  : {{ wildfly_version }}"
          - "Install workdir  : {{ wildfly_install_workdir }}"
          - "Instances (0..{{ wildfly_instance_count - 1 }}): port-offset x{{ wildfly_port_range_offset_step }}"
          - "App to deploy    : {{ wildfly_app.name }}"

  roles:
    - role: middleware_automation.wildfly.wildfly_install

  tasks:
    - name: "Configure systemd unit for WildFly instance {{ item }}"
      ansible.builtin.include_role:
        name: middleware_automation.wildfly.wildfly_systemd
      vars:
        wildfly_instance_name: "wildfly-{{ item }}"
        wildfly_node_id: "{{ inventory_hostname_short }}-{{ item }}"
        wildfly_config_base: "{{ wildfly_ha_config }}"
        wildfly_port_range_offset: "{{ item | int * wildfly_port_range_offset_step }}"
        wildfly_basedir_prefix: "{{ wildfly_install_workdir }}wildfly-{{ wildfly_version }}"
        wildfly_bind_addr: "{{ wildfly_bind_addr | default('0.0.0.0') }}"
        wildfly_bind_addr_private: "{{ ansible_default_ipv4.address | default('127.0.0.1') }}"
        wildfly_bind_addr_management: "127.0.0.1"
        wildfly_multicast_addr: "{{ wildfly_cluster_multicast_addr }}"
      loop: "{{ range(0, wildfly_instance_count) | list }}"

    - name: "Wait for all management ports to become available"
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: "{{ 9990 + (item | int * wildfly_port_range_offset_step) }}"
        timeout: 120
        delay: 5
      loop: "{{ range(0, wildfly_instance_count) | list }}"

    - name: "Deploy {{ wildfly_app.name }} to instance {{ item }}"
      ansible.builtin.include_role:
        name: middleware_automation.wildfly.wildfly_app_deploy
      vars:
        wildfly_app_deployment_file: "{{ wildfly_app.local_path }}"
        wildfly_app_deploy_name: "{{ wildfly_app.name }}"
        wildfly_home: "{{ wildfly_install_workdir }}wildfly-{{ wildfly_version }}"
        jboss_cli_controller_host: "127.0.0.1"
        jboss_cli_controller_port: "9990"
        wildfly_port_range_offset: "{{ item | int * wildfly_port_range_offset_step }}"
        wildfly_apps_jboss_cli_deploy_force: true
      loop: "{{ range(0, wildfly_instance_count) | list }}"

  post_tasks:
    - name: "Validate WildFly instance {{ item }} is running and app is accessible"
      ansible.builtin.include_tasks: validate.yml
      vars:
        instance_http_port: "{{ 8080 + (item | int * wildfly_port_range_offset_step) }}"
        instance_mgmt_port: "{{ 9990 + (item | int * wildfly_port_range_offset_step) }}"
        instance_id: "{{ item }}"
      loop: "{{ range(0, wildfly_instance_count) | list }}"
